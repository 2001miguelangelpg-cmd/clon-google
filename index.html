<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clon de Google</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Conexion con los iconos de google -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>

<body>
    <header>
        <div class="header-links">
            <a href="#">Gmail</a>
            <a href="#">Imágenes</a>
        </div>

        <!-- Icono de aplicaciones de google -->
        <span class="material-symbols-outlined apps-icon" title="Aplicaciones de Google">apps</span>

        <!-- Foto de perfil circulo del perfil -->
        <div class="profile-pic" title="Perfil">M</div>
    </header>

    <main>
        <!-- Logo de Google -->
        <div class="logo">
            <span class="g-blue">G</span>
            <span class="g-red">o</span>
            <span class="g-yellow">o</span>
            <span class="g-blue">g</span>
            <span class="g-green">l</span>
            <span class="g-red">e</span>
        </div>

        <!-- Contenedor del buscador -->
        <div class="search-container">
            <!-- Icono del buscador -->
            <span class="material-symbols-outlined search-icon">search</span>

            <!-- Campo para escribir en el buscador -->
            <input type="text" class="search-input" autofocus title="Buscar">

            <!-- Iconos de busqueda por voz y por imagen -->
            <div class="search-icons-right">
                <span class="material-symbols-outlined mic-icon" title="Búsqueda por voz">mic</span>
                <span class="material-symbols-outlined lens-icon" title="Búsqueda por imagen">photo_camera</span>
            </div>
        </div>

        <!-- Botones de google -->
        <div class="buttons-container">
            <button class="btn">Buscar con Google</button>
            <button class="btn">Voy a tener suerte</button>
        </div>

        <!-- Idiomas -->
        <div class="language-offer">
            Google disponible en: <a href="#">Español (Latinoamérica)</a>
        </div>
    </main>

    <footer>
        <div class="footer-location">
            Colombia
        </div>
        <div class="footer-links-container">
            <div class="footer-links">
                <a href="#">Sobre Google</a>
                <a href="#">Publicidad</a>
                <a href="#">Negocios</a>
                <a href="#">Cómo funciona la Búsqueda</a>
            </div>
            <div class="footer-links">
                <a href="#">Privacidad</a>
                <a href="#">Condiciones</a>
                <a href="#">Configuración</a>
            </div>
        </div>
    </footer>
</body>

</html>
